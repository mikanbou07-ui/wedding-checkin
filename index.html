<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Wedding Reception</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* ------------------------------------
       全体（花の背景 × ピンク × ゴールド）
    ------------------------------------ */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
      background: url("https://images.unsplash.com/photo-1529634850-1a1d1e1f1f1f?auto=format&fit=crop&w=1200&q=80")
        center/cover no-repeat;
      background-attachment: fixed;
      color: #4a3b3b;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 245, 248, 0.75);
      z-index: -1;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ------------------------------------
       タイトル（筆記体 × ゴールド）
    ------------------------------------ */
    .title {
      font-family: "Great Vibes", "Brush Script MT", cursive;
      font-size: 56px;
      font-weight: bold;
      color: #c9a14a;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      font-size: 20px;
      color: #b08b3c;
      margin-bottom: 32px;
      text-align: center;
    }

    /* ------------------------------------
       Groom / Bride カード
    ------------------------------------ */
    .button-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 32px;
    }

    .role-card {
      width: 170px;
      height: 250px;
      border-radius: 28px;
      border: 2px solid #d4b15a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-align: center;
    }

    .role-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 26px rgba(0,0,0,0.18);
    }

    .role-card.groom {
      background: linear-gradient(180deg, #1f3558 0%, #16243f 100%);
      color: #fff;
    }

    .role-card.bride {
      background: linear-gradient(180deg, #f7c8d8 0%, #f3a9c4 100%);
      color: #fff;
    }

    .role-card .line1 {
      font-family: "Great Vibes", "Brush Script MT", cursive;
      font-size: 36px;
      margin-bottom: 6px;
    }
