<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>結婚式受付システム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+JP:wght@400;500;600;700&display=swap');

    :root {
      --pink: #A67189;
      --pink-light: #f9e9ed;
      --blue: #3F4A59;
      --gold: #c7a46a;
      --gold-light: #e7d2a7;
      --ivory: #fffdf9;
      --text: #5b4a4d;
      --text-light: #8b777b;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Serif JP", serif;
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(231,210,167,0.16) 0,
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(217,154,168,0.12) 0,
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #fffdf9 0%,
          #fff7f8 50%,
          #fffdf9 100%
        );
      color: var(--text);
      letter-spacing: 0.04em;
    }

    body::before,
    body::after {
      content: "✦";
      position: fixed;
      color: rgba(199,164,106,0.22);
      font-family: "Noto Serif JP", serif;
      font-size: 80px;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: 25px;
      left: 30px;
    }

    body::after {
      right: 30px;
      bottom: 25px;
    }

    .screen {
      display: none;
      height: 100vh;
      min-height: 600px;
      padding: 35px 24px;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1,
    h2 {
      margin: 10px 0 20px;
      text-align: center;
      font-family: "Noto Serif JP", serif;
      font-weight: 600;
      color: var(--text);
    }

    h1 {
      font-size: clamp(34px, 6vw, 54px);
      letter-spacing: 0.12em;
      margin-bottom: 12px;
    }

    h1::after {
      content: "";
      display: block;
      width: 70px;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        var(--gold),
        transparent
      );
      margin: 18px auto 0;
    }

    h2 {
      font-size: clamp(17px, 3vw, 23px);
      font-weight: 500;
      color: var(--text-light);
      letter-spacing: 0.08em;
    }

    /* =================================
       スタート画面
    ================================= */

    #screen-start {
      justify-content: center;
      padding-top: 20px;
      padding-bottom: 20px;
    }

    /* Wedding Reception */
    #screen-start h1 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(100px, 13vw, 150px);
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0;
      line-height: 1;
      margin: 0 0 65px;
      white-space: nowrap;
    }

    #screen-start h1::after {
      display: none;
    }

    /* Groom / Bride */
    #screen-start .row {
      gap: 45px;
      width: 100%;
      justify-content: center;
      align-items: center;
    }

    /* =================================
       Groom / Bride ボタン
    ================================= */

    .side-button {
      width: 380px;
      height: 300px;

      margin: 0;

      border-radius: 28px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: white;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    /* Groom */
    .groom-button {
      background: #3F4A59;
      border: 1px solid #3F4A59;

      box-shadow:
        0 10px 25px rgba(63, 74, 89, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .groom-button:hover {
      transform: translateY(-4px);

      box-shadow:
        0 15px 32px rgba(63, 74, 89, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }

    /* Bride */
    .bride-button {
      background: #A67189;
      border: 1px solid #A67189;

      box-shadow:
        0 10px 25px rgba(166, 113, 137, 0.25),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .bride-button:hover {
      transform: translateY(-4px);

      box-shadow:
        0 15px 32px rgba(166, 113, 137, 0.32),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    /* Groom / Bride
       64px → 128px（2倍）
    */
    .side-title {
      font-family: "Great Vibes", cursive;
      font-size: 128px;
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0.02em;
    }

    /* Naoki / Mika */
    .side-button .person-name {
      font-family: "Great Vibes", cursive;
      font-size: 42px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.02em;

      margin-top: 22px;
      line-height: 1;
    }

    /* =================================
       共通ボタン
    ================================= */

    button {
      padding: 14px 34px;
      margin: 8px;
      min-width: 150px;

      font-family: "Noto Serif JP", serif;
      font-size: 17px;
      letter-spacing: 0.08em;

      border-radius: 999px;
      border: 1px solid var(--gold);

      cursor: pointer;

      background: linear-gradient(
        135deg,
        #dca4b0,
        #c98696
      );

      color: white;

      box-shadow:
        0 5px 14px rgba(185, 125, 140, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.35);

      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 18px rgba(185, 125, 140, 0.25),
        inset 0 1px 0 rgba(255,255,255,0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: rgba(255,255,255,0.8);
      color: var(--text-light);
      border-color: #d8c5b0;

      box-shadow:
        0 4px 10px rgba(100,80,80,0.08);
    }

    button.small {
      min-width: auto;
      font-size: 13px;
      padding: 9px 18px;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* =================================
       管理者ボタン
    ================================= */

    .admin-link {
      position: fixed;
      right: 18px;
      bottom: 18px;

      font-size: 11px;

      min-width: auto;
      padding: 8px 15px !important;

      background: rgba(255,255,255,0.7) !important;
      color: #9b878b !important;

      border: 1px solid #dbc8ae !important;

      box-shadow: none !important;
    }

    /* =================================
       ゲスト選択画面
    ================================= */

    #screen-select {
      justify-content: center;
    }

    #select-title {
      max-width: 800px;
      margin-bottom: 25px;

      font-family: "Great Vibes", cursive;
      font-size: clamp(34px, 6vw, 52px);
      font-weight: 400;

      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .guest-list {
      max-height: 58vh;
      overflow-y: auto;

      width: 100%;
      max-width: 620px;

      border: 1px solid var(--gold-light);
      border-radius: 16px;

      padding: 14px;

      background: rgba(255,255,255,0.82);

      box-shadow:
        0 10px 30px rgba(120,90,90,0.08),
        inset 0 0 0 4px rgba(231,210,167,0.12);
    }

    .guest-list::-webkit-scrollbar {
      width: 6px;
    }

    .guest-list::-webkit-scrollbar-thumb {
      background: #dec4c9;
      border-radius: 10px;
    }

    .guest-item {
      padding: 14px 17px;
      margin: 6px 0;

      border-radius: 10px;

      cursor: pointer;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border: 1px solid #eee1e2;

      background: rgba(255,255,255,0.75);

      color: var(--text);

      transition: all 0.18s ease;
    }

    .guest-item:hover {
      border-color: var(--gold-light);
      background: #fff8f9;
    }

    .guest-item.selected {
      background: linear-gradient(
        90deg,
        #f9e7eb,
        #fffaf8
      );

      border-color: var(--gold);

      box-shadow:
        0 3px 10px rgba(199,164,106,0.12);
    }

    .guest-item span.checked {
      font-size: 11px;

      color: #a68b58;

      border: 1px solid #dcc898;

      padding: 3px 8px;

      border-radius: 999px;

      background: #fffaf0;
    }

    /* =================================
       メッセージ画面
    ================================= */

    #message-title {
      margin-bottom: 22px;
    }

    .message-photo {
      max-width: 88vw;
      max-height: 48vh;

      object-fit: contain;

      border-radius: 14px;

      border: 5px solid white;

      outline: 1px solid var(--gold-light);

      box-shadow:
        0 10px 30px rgba(100,80,80,0.18);

      margin-bottom: 22px;

      background: #faf7f5;
    }

    .message-text {
      font-size: 22px;
      line-height: 1.9;

      text-align: center;

      padding: 0 20px;

      color: var(--text);
    }

    #countdown {
      font-size: 14px !important;
      margin-top: 18px !important;

      color: var(--text-light) !important;

      letter-spacing: 0.05em;
    }

    #btn-message-back {
      margin-top: 12px !important;
    }

    /* =================================
       管理者画面
    ================================= */

    #screen-admin h1 {
      margin-bottom: 15px;
    }

    .admin-table {
      max-width: 800px;
      width: 100%;

      max-height: 58vh;

      overflow-y: auto;

      border: 1px solid var(--gold-light);

      border-radius: 14px;

      background: rgba(255,255,255,0.88);

      padding: 10px 14px;

      box-shadow:
        0 8px 25px rgba(100,80,80,0.08);
    }

    .admin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 10px 5px;

      border-bottom: 1px solid #f0e4e3;

      font-size: 14px;
    }

    .admin-row:last-child {
      border-bottom: none;
    }

    .admin-row span.side {
      width: 80px;

      color: var(--gold);

      font-size: 12px;
    }

    .admin-row span.name {
      flex: 1;
      color: var(--text);
    }

    .admin-row span.status {
      width: 80px;
      text-align: center;
    }

    .admin-row input[type="checkbox"] {
      transform: scale(1.3);
      accent-color: var(--pink);
    }

    #screen-admin .row {
      margin-bottom: 15px;
    }

    #screen-admin .row button {
      background: #fffaf8;

      color: var(--text-light);

      border-color: #d8c3a4;

      box-shadow: none;
    }

    #screen-admin .row button:hover {
      background: var(--pink-light);
    }

    /* =================================
       モーダル
    ================================= */

    .modal {
      position: fixed;
      inset: 0;

      background: rgba(80,60,60,0.38);

      backdrop-filter: blur(5px);

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.98),
          rgba(255,247,248,0.98)
        );

      padding: 30px 25px;

      border-radius: 18px;

      border: 1px solid var(--gold-light);

      max-width: 340px;
      width: 88%;

      text-align: center;

      box-shadow:
        0 20px 50px rgba(80,60,60,0.2);
    }

    .modal-content h2 {
      font-size: 20px;
      margin-bottom: 22px;
    }

    .modal-content input {
      width: 100%;

      padding: 12px;

      font-family: "Noto Serif JP", serif;
      font-size: 18px;

      margin: 10px 0 20px;

      box-sizing: border-box;

      border: 1px solid #ddc7ca;

      border-radius: 8px;

      background: #fffdfc;

      color: var(--text);

      text-align: center;

      letter-spacing: 0.2em;

      outline: none;
    }

    .modal-content input:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(199,164,106,0.12);
    }

    .error {
      color: #b56d78;

      font-size: 13px;

      min-height: 18px;

      margin-bottom: 5px;
    }

    /* =================================
       タブレット
    ================================= */

    @media (max-width: 850px) {

      #screen-start h1 {
        font-size: clamp(80px, 14vw, 120px);
      }

      #screen-start .row {
        gap: 25px;
      }

      .side-button {
        width: 300px;
        height: 240px;
      }

      .side-title {
        font-size: 108px;
      }

      .side-button .person-name {
        font-size: 36px;
      }
    }

    /* =================================
       スマートフォン
    ================================= */

    @media (max-width: 600px) {

      .screen {
        padding: 25px 15px;
        min-height: 100vh;
      }

      #screen-start h1 {
        font-size: 82px;
        margin-bottom: 55px;
      }

      #screen-start .row {
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }

      .side-button {
        width: min(380px, 88vw);
        height: 170px;
      }

      .side-title {
        font-size: 100px;
      }

      .side-button .person-name {
        font-size: 34px;
        margin-top: 12px;
      }

      .guest-list {
        max-height: 55vh;
        padding: 10px;
      }

      .guest-item {
        padding: 13px 12px;
        font-size: 15px;
      }

      #select-title {
        font-size: 38px;
      }

      .message-photo {
        max-height: 42vh;
      }

      .message-text {
        font-size: 19px;
      }
    }

  </style>
</head>

<body>

  <!-- =================================
       スタート画面
  ================================== -->

  <div id="screen-start" class="screen active">

    <h1>Wedding Reception</h1>

    <div class="row">

      <!-- Groom -->
      <button
        id="btn-groom"
        class="side-button groom-button"
      >
        <span class="side-title">Groom</span>
        <span class="person-name">-Naoki-</span>
      </button>

      <!-- Bride -->
      <button
        id="btn-bride"
        class="side-button bride-button"
      >
        <span class="side-title">Bride</span>
        <span class="person-name">-Mika-</span>
      </button>

    </div>

    <button
      class="admin-link small"
      id="btn-admin-open"
    >
      管理者
    </button>

  </div>


  <!-- =================================
       ゲスト選択画面
  ================================== -->

  <div id="screen-select" class="screen">

    <h1 id="select-title">
      Groom's Guests
    </h1>

    <div
      class="guest-list"
      id="guest-list"
    ></div>

    <div class="row">

      <button
        class="secondary"
        id="btn-select-back"
      >
        戻る
      </button>

      <button id="btn-select-confirm">
        決定
      </button>

    </div>

  </div>


  <!-- =================================
       メッセージ表示画面
  ================================== -->

  <div id="screen-message" class="screen">

    <h1 id="message-title">
      メッセージ
    </h1>

    <img
      id="message-photo"
      class="message-photo"
      src=""
      alt="写真"
    />

    <div
      id="message-text"
      class="message-text"
    ></div>

    <div
      id="countdown"
      style="font-size:20px; margin-top:20px;"
    >
      20秒後にスタート画面へ戻ります
    </div>

    <button
      id="btn-message-back"
      class="secondary"
      style="margin-top:20px;"
    >
      スタート画面に戻る
    </button>

  </div>


  <!-- =================================
       管理者画面
  ================================== -->

  <div id="screen-admin" class="screen">

    <h1>管理者画面</h1>

    <div class="row">

      <button
        class="small"
        data-filter="all"
      >
        全員
      </button>

      <button
        class="small"
        data-filter="groom"
      >
        Groom
      </button>

      <button
        class="small"
        data-filter="bride"
      >
        Bride
      </button>

    </div>

    <div
      class="admin-table"
      id="admin-table"
    ></div>

    <button
      class="secondary"
      id="btn-admin-back"
    >
      スタート画面に戻る
    </button>

  </div>


  <!-- =================================
       管理者パスコードモーダル
  ================================== -->

  <div
    id="modal-admin"
    class="modal"
  >

    <div class="modal-content">

      <h2>
        管理者パスコード
      </h2>

      <input
        type="password"
        id="admin-pass-input"
        maxlength="4"
        placeholder="4桁の数字"
      />

      <div
        id="admin-pass-error"
        class="error"
      ></div>

      <button id="btn-admin-pass-ok">
        OK
      </button>

      <button
        class="secondary small"
        id="btn-admin-pass-cancel"
      >
        キャンセル
      </button>

    </div>

  </div>

      { id: 35, side: "groom", name: "石橋和也", message: "石橋和也", photo: "photos/demo.jpg" },
      { id: 36, side: "groom", name: "田尾一真", message: "田尾一真", photo: "photos/demo.jpg" },
      { id: 37, side: "groom", name: "小林千尋", message: "小林千尋", photo: "photos/demo.jpg" },
      { id: 38, side: "groom", name: "奥野和希", message: "奥野和希", photo: "photos/demo.jpg" },
      { id: 39, side: "groom", name: "生田海斗", message: "生田海斗", photo: "photos/demo.jpg" },
      { id: 40, side: "groom", name: "神谷友理子", message: "神谷友理子", photo: "photos/demo.jpg" },
      { id: 41, side: "groom", name: "富田貴美", message: "富田貴美", photo: "photos/demo.jpg" }
    ];

    const ADMIN_PASS = "1206";
    const CHECK_KEY = "wedding_checked";

    let currentSide = null;
    let selectedGuestId = null;
    let timerId = null;
    let checkedMap = {};

    // 画面切り替え
    function showScreen(id) {
      document
        .querySelectorAll(".screen")
        .forEach(s => s.classList.remove("active"));

      document
        .getElementById(id)
        .classList.add("active");
    }

    // localStorage読み込み
    function loadChecked() {
      const raw = localStorage.getItem(CHECK_KEY);
      checkedMap = raw ? JSON.parse(raw) : {};
    }

    function saveChecked() {
      localStorage.setItem(
        CHECK_KEY,
        JSON.stringify(checkedMap)
      );
    }

    function isChecked(id) {
      return !!checkedMap[id];
    }

    function setChecked(id, value) {
      checkedMap[id] = !!value;
      saveChecked();
    }

    // スタート画面イベント
    document
      .getElementById("btn-groom")
      .addEventListener("click", () => {

        currentSide = "groom";
        selectedGuestId = null;

        renderGuestList();
        showScreen("screen-select");
      });

    document
      .getElementById("btn-bride")
      .addEventListener("click", () => {

        currentSide = "bride";
        selectedGuestId = null;

        renderGuestList();
        showScreen("screen-select");
      });

    document
      .getElementById("btn-select-back")
      .addEventListener("click", () => {

        selectedGuestId = null;
        showScreen("screen-start");
      });

    // 名前一覧表示
    function renderGuestList() {

      const title =
        currentSide === "groom"
          ? "Groom's Guests"
          : "Bride's Guests";

      document
        .getElementById("select-title")
        .textContent = title;

      const listEl =
        document.getElementById("guest-list");

      listEl.innerHTML = "";

      guests
        .filter(g => g.side === currentSide)
        .forEach(g => {

          const item =
            document.createElement("div");

          item.className = "guest-item";

          if (g.id === selectedGuestId) {
            item.classList.add("selected");
          }

          const nameSpan =
            document.createElement("span");

          nameSpan.textContent = g.name;

          const statusSpan =
            document.createElement("span");

          if (isChecked(g.id)) {
            statusSpan.className = "checked";
            statusSpan.textContent = "受付済み";
          }

          item.appendChild(nameSpan);
          item.appendChild(statusSpan);

          item.addEventListener("click", () => {

            selectedGuestId = g.id;
            renderGuestList();

          });

          listEl.appendChild(item);
        });
    }

    // 決定ボタン → メッセージ画面へ
    document
      .getElementById("btn-select-confirm")
      .addEventListener("click", () => {

        if (!selectedGuestId) {

          alert("名前を選択してください。");
          return;
        }

        const guest =
          guests.find(g => g.id === selectedGuestId);

        if (!guest) return;

        setChecked(guest.id, true);

        document
          .getElementById("message-title")
          .textContent =
          guest.name + " さんへのメッセージ";

        document
          .getElementById("message-photo")
          .src = guest.photo;

        document
          .getElementById("message-text")
          .textContent = guest.message;

        showScreen("screen-message");

        // カウントダウン処理
        let remaining = 20;

        const countdownEl =
          document.getElementById("countdown");

        countdownEl.textContent =
          `${remaining}秒後にスタート画面へ戻ります`;

        if (timerId) {
          clearInterval(timerId);
        }

        timerId = setInterval(() => {

          remaining--;

          countdownEl.textContent =
            `${remaining}秒後にスタート画面へ戻ります`;

          if (remaining <= 0) {

            clearInterval(timerId);

            selectedGuestId = null;

            showScreen("screen-start");
          }

        }, 1000);
      });

    // 戻るボタン
    document
      .getElementById("btn-message-back")
      .addEventListener("click", () => {

        if (timerId) {
          clearInterval(timerId);
        }

        selectedGuestId = null;

        showScreen("screen-start");
      });

    // 管理者モーダル
    const modalAdmin =
      document.getElementById("modal-admin");

    const adminPassInput =
      document.getElementById("admin-pass-input");

    const adminPassError =
      document.getElementById("admin-pass-error");

    document
      .getElementById("btn-admin-open")
      .addEventListener("click", () => {

        adminPassInput.value = "";
        adminPassError.textContent = "";

        modalAdmin.classList.add("active");

        adminPassInput.focus();
      });

    document
      .getElementById("btn-admin-pass-cancel")
      .addEventListener("click", () => {

        modalAdmin.classList.remove("active");
      });

    document
      .getElementById("btn-admin-pass-ok")
      .addEventListener("click", () => {

        const val =
          adminPassInput.value.trim();

        if (val === ADMIN_PASS) {

          modalAdmin.classList.remove("active");

          renderAdminTable("all");

          showScreen("screen-admin");

        } else {

          adminPassError.textContent =
            "パスコードが違います。";
        }
      });

    // 管理者画面
    function renderAdminTable(filter) {

      const table =
        document.getElementById("admin-table");

      table.innerHTML = "";

      guests
        .filter(g =>
          filter === "all"
            ? true
            : g.side === filter
        )
        .forEach(g => {

          const row =
            document.createElement("div");

          row.className = "admin-row";

          const sideSpan =
            document.createElement("span");

          sideSpan.className = "side";

          sideSpan.textContent =
            g.side === "groom"
              ? "Groom"
              : "Bride";

          const nameSpan =
            document.createElement("span");

          nameSpan.className = "name";
          nameSpan.textContent = g.name;

          const statusSpan =
            document.createElement("span");

          statusSpan.className = "status";

          const checkbox =
            document.createElement("input");

          checkbox.type = "checkbox";
          checkbox.checked = isChecked(g.id);

          checkbox.addEventListener(
            "change",
            () => {
              setChecked(
                g.id,
                checkbox.checked
              );
            }
          );

          statusSpan.appendChild(checkbox);

          row.appendChild(sideSpan);
          row.appendChild(nameSpan);
          row.appendChild(statusSpan);

          table.appendChild(row);
        });
    }

    document
      .querySelectorAll(
        "#screen-admin .row button"
      )
      .forEach(btn => {

        btn.addEventListener("click", () => {

          const filter =
            btn.getAttribute("data-filter");

          renderAdminTable(filter);
        });
      });

    document
      .getElementById("btn-admin-back")
      .addEventListener("click", () => {

        showScreen("screen-start");
      });

    // 初期化
    loadChecked();

  </script>

</body>
</html>
